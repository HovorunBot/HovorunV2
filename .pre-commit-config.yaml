# See https://pre-commit.com for more information
default_install_hook_types: [pre-commit, pre-push, commit-msg, post-commit]
repos:
  - repo: local
    hooks:
      - id: update-changelog
        name: Generate changelog and amend commit
        entry: sh scripts/update-changelog-after-commit.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [post-commit]

      - id: commitizen-check
        name: Commitizen Conventional Commits
        entry: uv run cz check --commit-msg-file
        language: system
        stages: [commit-msg]

      - id: ruff-format
        name: Ruff Formatter
        entry: uv run ruff format
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: ruff-check
        name: Ruff Linter
        entry: uv run ruff check
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: ty-check
        name: Type Checker (ty)
        entry: uv run ty check src
        language: system
        types: [python]
        pass_filenames: false
        stages: [pre-commit]

      - id: import-linter
        name: Import Linter (Architecture Contracts)
        entry: env PYTHONPATH=src uv run lint-imports
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
