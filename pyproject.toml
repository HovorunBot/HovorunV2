[project]
name = "hovorunv2"
version = "0.2.1"
description = "The ultimate wingman for your Telegram group chats — making them smarter, faster, and way more fun."
readme = "README.md"
authors = [
    { name = "TwilightSparkle42", email = "jaden.corr42@gmail.com" }
]
license = { text = "BSD-3-Clause" }
keywords = ["telegram", "bot", "aiogram", "chat-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.15",
    "Topic :: Communications :: Chat",
]
requires-python = ">=3.15"
dependencies = [
    "aiogram",
    "pydantic",
    "pydantic-settings",
    "aiohttp",
    "redis>=7.4,<8",
    "sqlalchemy",
    "greenlet",
    "alembic",
    "yt-dlp",
    "instaloader",
    "beautifulsoup4",
    "dishka",
    "cryptography",
    "pycountry",
    "celery[redis]>=5.7.0rc1",
    "casbin",
    "psycopg[binary]",
    "requests",
]

[project.optional-dependencies]
browser = ["DrissionPage"]
legacy-import = ["aiosqlite"]

[project.urls]
Repository = "https://github.com/HovorunBot/HovorunV2"
Issues = "https://github.com/HovorunBot/HovorunV2/issues"

[project.scripts]
hovorunv2 = "hovorunv2.__main__:main"
hovorun-admin = "hovorunv2.bootstrap.admin:main"
hovorun-import-sqlite = "hovorunv2.bootstrap.sqlite_to_postgres:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hovorunv2"]

[dependency-groups]
dev = [
    "aiosqlite",
    "aioresponses",
    "commitizen",
    "DrissionPage",
    "import-linter",
    "pre-commit",
    "pytest",
    "pytest-alembic",
    "pytest-asyncio",
    "pytest-recording",
    "ruff",
    "ty",
    "pytest-xdist",
    "pytest-cov",
]

[tool.ruff]
line-length = 120
target-version = "py315"
exclude = ["alembic"]

[tool.ruff.lint]
select = ["ALL"]
# Opt in to nesting and condition-size checks without selecting every preview rule.
preview = true
explicit-preview-rules = true
extend-select = ["PLR0916", "PLR1702"]
ignore = [
    "D107",
    "D203",
    "D213",
    "COM812",
    "ISC001",
    "S101", # Use of assertions allowed by user intent not for business logic
    "PLR0913",
    "PLR0917",
    "D104",
    "BLE001",
    "TC",
    "ARG001",
    "ARG002",
    "ANN401",
    "CPY001",
]

[tool.ruff.lint.flake8-builtins]
strict-checking = true

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50
max-returns = 6
max-nested-blocks = 3
max-bool-expr = 4

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["FBT", "PLR2004"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto --maxprocesses=15 --strict-markers --strict-config -ra"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
xfail_strict = true
filterwarnings = [
    "error",
    "ignore:Exception ignored while finalizing socket:pytest.PytestUnraisableExceptionWarning",
]
markers = [
    "unit: pure unit tests requiring zero infrastructure (no DB, Valkey, network, browser)",
    "slow: tests taking longer than 1 second to execute",
    "browser: tests requiring headless Chromium browser instances",
    "subprocess: tests spawning separate OS processes or genuine forks",
    "vcr: tests using pytest-recording VCR cassette replay or recording",
    "fresh_schema: integration tests mutating schema DDL requiring a disposable PostgreSQL schema",
]

[tool.coverage.run]
# Dynamic per-test contexts require the C tracer on Python 3.15.
core = "ctrace"
source = ["src/hovorunv2"]
branch = true
omit = [
    "alembic/*",
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
annotated_tag = true
bump_message = "chore(release): bump version to $new_version"
version_files = [
    "uv.lock:version = \"$current_version\"",
]



[tool.ty.src]
exclude = ["alembic/**"]

[tool.importlinter]
root_package = "hovorunv2"

[[tool.importlinter.contracts]]
name = "Layered Architecture"
type = "layers"
layers = [
    "hovorunv2.bootstrap",
    "hovorunv2.interface",
    "hovorunv2.infrastructure",
    "hovorunv2.application",
    "hovorunv2.domain",
]

