name: hovorunv2-dev

x-app: &app
  image: hovorunv2-dev:${APP_VERSION:-local}
  build:
    context: .
    target: lean
    args:
      APP_VERSION: ${APP_VERSION:-}

x-browser: &browser
  image: hovorunv2-dev-browser:${APP_VERSION:-local}
  build:
    context: .
    target: browser
    args:
      APP_VERSION: ${APP_VERSION:-}

x-import: &import
  image: hovorunv2-dev-import:${APP_VERSION:-local}
  build:
    context: .
    target: legacy-import
    args:
      APP_VERSION: ${APP_VERSION:-}

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://hovorun:hovorun@postgres:5432/hovorun
  VALKEY_URL: redis://valkey:6379/0
  BOT_TOKEN: ${BOT_TOKEN:-}
  CACHE_ENCRYPTION_KEY: ${CACHE_ENCRYPTION_KEY:-}
  APP_VERSION: ${APP_VERSION:-}

x-worker: &worker
  <<: *app
  restart: unless-stopped
  environment:
    <<: *app-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: hovorun
      POSTGRES_USER: hovorun
      POSTGRES_PASSWORD: hovorun
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    image: valkey/valkey:8.0
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://hovorun:hovorun@postgres:5432/hovorun
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  bot:
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      <<: *app-environment

  worker-media:
    <<: *worker
    environment:
      <<: *app-environment
      INSTAGRAM_SESSIONID: ${INSTAGRAM_SESSIONID:-}
      TRANSLATION_TARGET_LANG: ${TRANSLATION_TARGET_LANG:-uk}
      TRANSLATION_IGNORED_LANGS: '${TRANSLATION_IGNORED_LANGS:-["en", "ru", "uk", "und"]}'
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - worker
      - --pool=prefork
      - --concurrency=2
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
      - "--queues=work:{work}:media"

  worker-browser:
    <<: *browser
    environment:
      <<: *app-environment
      INSTAGRAM_SESSIONID: ${INSTAGRAM_SESSIONID:-}
      TRANSLATION_TARGET_LANG: ${TRANSLATION_TARGET_LANG:-uk}
      TRANSLATION_IGNORED_LANGS: '${TRANSLATION_IGNORED_LANGS:-["en", "ru", "uk", "und"]}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - worker
      - --pool=prefork
      - --concurrency=1
      - --max-tasks-per-child=1
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
      - "--queues=work:{work}:browser"

  worker-operations:
    <<: *worker
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - worker
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
      - "--queues=work:{work}:operations"

  beat:
    <<: *app
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      APP_VERSION: ${APP_VERSION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    command:
      - uv
      - run
      - --no-sync
      - celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/beat/celerybeat-schedule
      - --pidfile=/var/lib/celery/beat/celerybeat.pid
    volumes:
      - beat_state:/var/lib/celery/beat

  import-sqlite:
    <<: *import
    profiles: [tools]
    environment:
      DATABASE_URL: postgresql+psycopg://hovorun:hovorun@postgres:5432/hovorun
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "hovorun-import-sqlite"]
    restart: "no"

volumes:
  postgres_data:
  valkey_data:
  beat_state:
