name: hovorunv2-dev

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-app: &app
  logging: *logging
  image: hovorunv2-dev:${APP_TAG:-local}
  build:
    context: .
    target: lean
    args:
      APP_VERSION: ${APP_VERSION:-}

x-browser: &browser
  logging: *logging
  image: hovorunv2-dev-browser:${APP_TAG:-local}
  build:
    context: .
    target: browser
    args:
      APP_VERSION: ${APP_VERSION:-}

x-app-environment: &app-environment
  DATABASE_URL: postgresql+psycopg://hovorun:hovorun@postgres:5432/hovorun
  VALKEY_URL: redis://valkey:6379/0
  BOT_TOKEN: ${BOT_TOKEN:-}
  CACHE_ENCRYPTION_KEY: ${CACHE_ENCRYPTION_KEY:-}
  APP_VERSION: ${APP_VERSION:-}
  ERROR_DM_ENABLED: ${ERROR_DM_ENABLED:-False}
  BROWSER_ENABLED: ${BROWSER_ENABLED:-False}

x-worker-health: &worker-health
  test: ["CMD-SHELL", "/app/.venv/bin/celery -A hovorunv2.bootstrap.worker_app:app inspect ping --destination celery@$$HOSTNAME --timeout 5"]
  interval: 60s
  timeout: 15s
  start_period: 30s
  retries: 3

x-worker: &worker
  stop_grace_period: 150s
  healthcheck: *worker-health
  <<: *app
  restart: unless-stopped
  environment:
    <<: *app-environment
  depends_on:
    migrate:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy

services:
  postgres:
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-1g}
    pids_limit: 128
    logging: *logging
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    restart: unless-stopped
    environment:
      POSTGRES_DB: hovorun
      POSTGRES_USER: hovorun
      POSTGRES_PASSWORD: hovorun
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  valkey:
    mem_limit: ${VALKEY_MEMORY_LIMIT:-1g}
    pids_limit: 128
    logging: *logging
    image: valkey/valkey:8.0@sha256:04b9002ae24bbe66687fb025052ed9bcebb54f8da3937338eb718d98d362887f
    restart: unless-stopped
    command: ["valkey-server", "--appendonly", "yes", "--maxmemory", "${VALKEY_MAXMEMORY:-512mb}", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    mem_limit: ${MIGRATE_MEMORY_LIMIT:-512m}
    pids_limit: 128
    <<: *app
    environment:
      DATABASE_URL: postgresql+psycopg://hovorun:hovorun@postgres:5432/hovorun
    depends_on:
      postgres:
        condition: service_healthy
    command: ["uv", "run", "--no-sync", "alembic", "upgrade", "head"]
    restart: "no"

  bot:
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "from pathlib import Path; raise SystemExit(not Path('/tmp/hovorun-bot-ready').is_file())"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
    mem_limit: ${BOT_MEMORY_LIMIT:-512m}
    pids_limit: 128
    <<: *app
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    env_file:
      - path: ${APP_ENV_FILE:-.env}
        required: false
    environment:
      <<: *app-environment

  worker-media:
    mem_limit: ${WORKER_MEDIA_MEMORY_LIMIT:-1536m}
    pids_limit: 256
    <<: *worker
    environment:
      <<: *app-environment
      INSTAGRAM_SESSIONID: ${INSTAGRAM_SESSIONID:-}
      TRANSLATION_TARGET_LANG: ${TRANSLATION_TARGET_LANG:-uk}
      TRANSLATION_IGNORED_LANGS: '${TRANSLATION_IGNORED_LANGS:-["en", "ru", "uk", "und"]}'
    command:
      - /app/.venv/bin/celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - worker
      - --pool=prefork
      - --concurrency=${MEDIA_CONCURRENCY:-1}
      - --max-tasks-per-child=10
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
      - "--queues=work:{work}:media"

  worker-browser:
    mem_limit: ${WORKER_BROWSER_MEMORY_LIMIT:-1536m}
    pids_limit: 512
    <<: *browser
    profiles: [browser]
    stop_grace_period: 150s
    healthcheck: *worker-health
    restart: unless-stopped
    environment:
      <<: *app-environment
      INSTAGRAM_SESSIONID: ${INSTAGRAM_SESSIONID:-}
      TRANSLATION_TARGET_LANG: ${TRANSLATION_TARGET_LANG:-uk}
      TRANSLATION_IGNORED_LANGS: '${TRANSLATION_IGNORED_LANGS:-["en", "ru", "uk", "und"]}'
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    command:
      - /app/.venv/bin/celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - worker
      - --pool=prefork
      - --concurrency=1
      - --max-tasks-per-child=1
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
      - "--queues=work:{work}:browser"

  worker-operations:
    mem_limit: ${WORKER_OPERATIONS_MEMORY_LIMIT:-512m}
    pids_limit: 128
    <<: *worker
    command:
      - /app/.venv/bin/celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - worker
      - --pool=prefork
      - --concurrency=1
      - --loglevel=INFO
      - --without-gossip
      - --without-mingle
      - --without-heartbeat
      - "--queues=work:{work}:operations"

  beat:
    mem_limit: ${BEAT_MEMORY_LIMIT:-256m}
    pids_limit: 64
    <<: *app
    restart: unless-stopped
    environment:
      VALKEY_URL: redis://valkey:6379/0
      APP_VERSION: ${APP_VERSION:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      valkey:
        condition: service_healthy
    command:
      - /app/.venv/bin/celery
      - -A
      - hovorunv2.bootstrap.worker_app:app
      - beat
      - --loglevel=INFO
      - --schedule=/var/lib/celery/beat/celerybeat-schedule
      - --pidfile=/var/lib/celery/beat/celerybeat.pid
    volumes:
      - beat_state:/var/lib/celery/beat

volumes:
  postgres_data:
  valkey_data:
  beat_state:
