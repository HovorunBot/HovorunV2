[request_definition]
r = role, action, target, group_admin

[policy_definition]
p = minimum_role, action, resource, authority

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.action == p.action && r.target.kind == p.resource && ((p.authority == "role" && atLeast(r.role, p.minimum_role)) || (p.authority == "group_admin" && r.group_admin))
